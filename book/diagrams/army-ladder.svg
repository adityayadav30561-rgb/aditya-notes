<path d="M1130,248 H1148 V318 H1130" fill="none" stroke="#1F3864" stroke-width="3"/>
<text x="1164" y="277.2" font-size="26" font-weight="bold" fill="#1F3864" text-anchor="start"><tspan x="1164" dy="0.0">TOP</tspan><tspan x="1164" dy="29.9">HQ</tspan></text>
<path d="M1130,354 H1148 V742 H1130" fill="none" stroke="#2E5597" stroke-width="3"/>
<text x="1164" y="557.1" font-size="26" font-weight="bold" fill="#2E5597" text-anchor="start"><tspan x="1164" dy="0.0">FORMATIONS</tspan></text>
<path d="M1130,778 H1148 V848 H1130" fill="none" stroke="#3B7D3A" stroke-width="3"/>
<text x="1164" y="822.1" font-size="26" font-weight="bold" fill="#3B7D3A" text-anchor="start"><tspan x="1164" dy="0.0">UNIT</tspan></text>
<path d="M1130,884 H1148 V1166 H1130" fill="none" stroke="#C98A00" stroke-width="3"/>
<text x="1164" y="1034.1" font-size="26" font-weight="bold" fill="#C98A00" text-anchor="start"><tspan x="1164" dy="0.0">SUB-UNITS</tspan></text>
<text x="1164" y="588.0" font-size="22" fill="#595959" text-anchor="start"><tspan x="1164" dy="0.0">all arms</tspan><tspan x="1164" dy="26.8">together</tspan></text>
<text x="1164" y="1065.0" font-size="22" fill="#595959" text-anchor="start"><tspan x="1164" dy="0.0">parts of</tspan><tspan x="1164" dy="26.8">a unit</tspan></text>
<text x="700" y="1220.0" font-size="22" font-style="italic" fill="#595959" text-anchor="middle"><tspan x="700" dy="0.0">Strengths are approximate and indicative; they vary by arm, role and terrain.</tspan></text>
</svg>
