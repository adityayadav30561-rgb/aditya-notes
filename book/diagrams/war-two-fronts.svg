  <text x="412" y="830" font-size="22" fill="#1A1A1A" text-anchor="start">first blow. Strike corps</text>
  <text x="412" y="858" font-size="22" fill="#1A1A1A" text-anchor="start">wait in reserve until</text>
  <text x="412" y="886" font-size="22" fill="#1A1A1A" text-anchor="start">Army HQ decides where</text>
  <text x="412" y="914" font-size="22" fill="#1A1A1A" text-anchor="start">to launch them.</text>
</g>
