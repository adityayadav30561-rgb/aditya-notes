<text x="700.0" y="56" font-size="40" fill="#1F3864" text-anchor="middle" font-weight="bold">Two fronts at once: who does what</text>
<text x="700.0" y="96" font-size="24" fill="#595959" text-anchor="middle" font-style="italic">Schematic - not to scale.  War on the LoC and the LAC at the same time.</text>
<g><rect x="6" y="124" width="48" height="1176" rx="10" fill="#B03A2E"/><text x="39" y="712.0" font-size="26" fill="#FFFFFF" text-anchor="middle" font-weight="bold" transform="rotate(-90 39 712.0)">PAKISTAN: LoC &amp; International Border</text></g>
