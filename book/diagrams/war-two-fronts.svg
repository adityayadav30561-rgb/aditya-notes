<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1476" viewBox="0 0 1400 1476" font-family="Arial, Helvetica, sans-serif">
<title>Two fronts at once: who does what</title>
<desc>Schematic, not to scale: Indian Army Commands, holding corps and strike corps on the western (Pakistan) and northern/eastern (China) fronts.</desc>
